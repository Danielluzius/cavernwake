    <title>Cavernwake</title>
    <!-- css/main.css is compiled from scss/ via `npm run watch:css` (or
         `npm run build:css` once) — never edit it directly. -->
    <link rel="stylesheet" href="./css/main.css" />
    <!-- Preload the resting frame that's shown the instant the game scene
         appears: browsers otherwise fetch it lazily on first use, causing
         a brief flash/pop-in. Same reason for the other three facing
         poses (see player/_player.scss) — the first click of a given
         direction otherwise still lazy-loads it right when the sprite
         swaps, producing the same flash. -->
    <link rel="preload" as="image" href="./assets/characters/with-backpack/base/base-right.png" />
    <link rel="preload" as="image" href="./assets/characters/with-backpack/base/base-left.png" />

    <link rel="preload" as="image" href="./assets/characters/with-backpack/base/base-up.png" />
</head>

        <!-- Title screen only — placeholder text/loading-bar art, real
             title/logo/credit copy and a timed auto-fade come later. -->
        <section class="scene scene--intro">
            <div class="title-screen">
                <h1 class="title-screen__title">CAVERNWAKE</h1>
                <div class="title-screen__loading-bar">
                    <div class="title-screen__loading-bar-fill"></div>
                </div>
                <p class="title-screen__credit">made by Daniel Luzius</p>
                <label class="title-screen__button" for="title-dismissed">WEITER</label>
            </div>
        </section>

        <!-- Real game scene, unlocked once the title screen is dismissed.
             Single stub room (segment 1 of the logic-map, see
             assets/world/logic-map.png) — real tile art is added later as
             separate pre-drawn image layers, this is structure only. -->
        <section class="scene scene--game">

            <div class="viewport" id="viewport">

                <div class="world-layer world-layer--background"></div>

                <div class="world">
                    <div class="world-layer world-layer--environment">
                        <div class="debug-map"></div>
                        <div class="room" style="--room-cols: 3; --room-rows: 7;"></div>
                    </div>

                    <div class="world-layer world-layer--objects"></div>

                    <div class="player">
                        <div class="player__sprite"></div>
                    </div>

                    <div class="world-layer world-layer--foreground"></div>
                </div>

            </div>

            <div class="ui">
                <div class="dev-controls">
                    <label class="dev-controls__button dev-controls__button--debug-grid" for="debug-grid">GRID</label>
                </div>

                     shape) plus one clickable overlay label per (position,
                     direction) edge in vars.$positions — only the edge(s)
